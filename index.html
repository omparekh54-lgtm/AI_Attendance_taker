<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#173d32"/><title>EigenRoll — Attendance, in focus.</title><meta name="description" content="Local-first classroom attendance using PCA and LDA face recognition."/></head><body><!--eigenroll-runtime--><div id="root"></div><script>if(new URLSearchParams(location.search).get('page')==='attendance'){const openAttendance=()=>{const button=[...document.querySelectorAll('button')].find(b=>b.textContent?.trim().startsWith('Take attendance'));if(button){button.click();}else{setTimeout(openAttendance,100);}};addEventListener('DOMContentLoaded',openAttendance);}</script><script type="module" src="/src/main.tsx"></script></body></html>
